[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "nonebot-plugin-xiuxian3"
version = "3"
description = "基于 Nonebot2 修仙文字游戏"
authors = [""]
license = "GPL-3.0-or-later"
readme = "README.md"
homepage = ""
repository = ""
documentation = ""
packages = [{ include = "nonebot_plugin_xiuxian3" }]

[tool.poetry.urls]
"Bug Tracker" = ""

[tool.poetry.dependencies]
nonebot2 = "^2.0.0rc4"
nonebot-adapter-onebot = "^2.2.3"
nonebot-plugin-apscheduler = "^0.2.0"


[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.poetry.group.test.dependencies]
nonebug = "^0.3.0"
pytest = "^7.2.0"
pytest-asyncio = "^0.20.3"
